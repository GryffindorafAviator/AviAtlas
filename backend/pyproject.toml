[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aviatlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "docling",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sentence-transformers",
    "numpy",
    "openai>=1.66",
    "chromadb",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]